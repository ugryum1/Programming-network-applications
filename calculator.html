<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор - ЛР 2</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/index.js" defer></script>
    <style>
        /* Адаптация сетки под 5 колонок */
        .calc-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }
        .calculator-container {
            width: 400px; /* Немного расширим контейнер */
        }
    </style>
</head>
<body class="light-theme">
    <div class="top-header">
        <div class="container">
            <h1>Быстрая поставка конвейеров</h1>
        </div>
    </div>

    <header class="navbar">
        <nav class="nav-links">
            <a href="index.html">
                <img src="./img/home-icon.png" alt="" class="nav-icon">
                <span>Главная</span>
            </a>
            <a href="calculator.html" class="active">Калькулятор</a>
            <a href="about.html">Об авторе</a>
            <a href="purpose.html">Цель работы</a>
        </nav>
        <div class="nav-actions">
            <select class="dropdown" id="background-select">
                <option value="solid">Обычный фон</option>
                <option value="image">Фон с картинкой</option>
            </select>
            <button class="btn btn-primary" id="theme-toggle">Включить тёмную тему</button>
        </div>
    </header>

    <main class="calc-wrapper">
        <div class="calc-main-group">
            <div class="calculator-container">
                <div class="result" id="result">0</div>

                <div class="calc-row">
                    <button class="my-btn execute secondary" id="btn_op_clear">C</button>
                    <button class="my-btn secondary" id="btn_op_backspace">←</button>
                    <button class="my-btn secondary" id="btn_mem_plus">M+</button>
                    <button class="my-btn secondary" id="btn_mem_minus">M-</button>
                    <button class="my-btn secondary" id="btn_mem_recall">MR</button>
                </div>

                <div class="calc-row">
                    <button class="my-btn" id="btn_digit_7">7</button>
                    <button class="my-btn" id="btn_digit_8">8</button>
                    <button class="my-btn" id="btn_digit_9">9</button>
                    <button class="my-btn primary" id="btn_op_div">/</button>
                    <button class="my-btn secondary" id="btn_op_sqrt">√</button>
                </div>

                <div class="calc-row">
                    <button class="my-btn" id="btn_digit_4">4</button>
                    <button class="my-btn" id="btn_digit_5">5</button>
                    <button class="my-btn" id="btn_digit_6">6</button>
                    <button class="my-btn primary" id="btn_op_mult">x</button>
                    <button class="my-btn secondary" id="btn_op_pow">xⁿ</button>
                </div>

                <div class="calc-row">
                    <button class="my-btn" id="btn_digit_1">1</button>
                    <button class="my-btn" id="btn_digit_2">2</button>
                    <button class="my-btn" id="btn_digit_3">3</button>
                    <button class="my-btn primary" id="btn_op_minus">-</button>
                    <button class="my-btn secondary" id="btn_op_fact">x!</button>
                </div>

                <div class="calc-row">
                    <button class="my-btn" id="btn_digit_0">0</button>
                    <button class="my-btn" id="btn_digit_dot">.</button>
                    <button class="my-btn" id="btn_op_sign">+/-</button>
                    <button class="my-btn primary" id="btn_op_plus">+</button>
                    <button class="my-btn secondary" id="btn_op_1k">1k</button>
                </div>

                <div class="calc-row">
                    <button class="my-btn execute" id="btn_op_equal" style="grid-column: span 5;">=</button>
                </div>
            </div>

            <div class="extra-controls" style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-outline" id="change-calc-color" style="color: #1a1a1a; border-color: #1a1a1a;">Цвет окна</button>
                <button class="btn btn-outline" id="change-result-color" style="color: #1a1a1a; border-color: #1a1a1a;">Цвет консоли</button>
            </div>
        </div>
    </main>
</body>
</html>
