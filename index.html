<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конвейерное оборудование — Галерея</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
<header>
    <h1>Конвейерное оборудование</h1>
    <label class="btn" for="uploadModel">Загрузить свою модель (.glb)
        <input type="file" id="uploadModel" accept=".glb,.gltf" multiple hidden>
    </label>
</header>
<div class="toolbar">
    <button class="btn" id="reverse-order">Развернуть порядок каталога</button>
</div>
<main id="card-list"></main>
<section class="report">
    <h2>Отчёт по производственной линии</h2>
    <pre id="report-body"></pre>
</section>
<script src="idb.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
