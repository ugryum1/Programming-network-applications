<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Конвейерное оборудование</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: Arial, Helvetica, sans-serif;
        }
        .navbar-custom {
            background-color: #1a3a5c;
        }
        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: box-shadow 0.2s;
        }
        .card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.18);
        }
        .btn-primary {
            background-color: #1a6bb5;
            border-color: #1a6bb5;
        }
        .btn-primary:hover {
            background-color: #14507a;
            border-color: #14507a;
        }
        .btn-outline-primary {
            color: #1a6bb5;
            border-color: #1a6bb5;
        }
        .btn-outline-primary:hover {
            background-color: #1a6bb5;
            border-color: #1a6bb5;
        }
        .product-tabs {
            display: flex;
            gap: 6px;
            margin-top: 20px;
            max-width: 700px;
            width: 100%;
        }
        .product-tabs .tab-btn {
            padding: 10px 28px;
            background: #2c2c2c;
            border: 2px solid #2c2c2c;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #e0e0e0;
            text-align: center;
            transition: background 0.2s, border-color 0.2s;
            outline: none;
        }
        .product-tabs .tab-btn:hover {
            background: #3a3a3a;
            border-color: #3a3a3a;
        }
        .product-tabs .tab-btn.active {
            background: #1a6bb5 !important;
            border-color: #1a6bb5 !important;
            color: #fff !important;
        }
        .tab-content-panel {
            max-width: 700px;
            width: 100%;
            background: #fff;
            border: 1px solid #ddd;
            border-top: none;
            padding: 20px 24px;
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand mb-0 h1" href="#" id="nav-home" style="text-decoration:none;cursor:pointer;">Конвейерное оборудование</a>
    </div>
</nav>
<div id="root" class="container"></div>
<script src="main.js" type="module"></script>

<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
